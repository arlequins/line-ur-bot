name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Create non-secret environment file
        run: printf 'ENVIRONMENT=%s\n' "${{ vars.ENVIRONMENT }}" > .env

      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
